<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | TempoAthletics</title>
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logos/tempo-runner-black.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout" data-no-footer>
<main class="checkout">
  <div class="wrap">
    <h1 class="display" style="font-size:clamp(40px,6vw,72px);margin-bottom:40px">Checkout</h1>
    <div class="checkout-grid" data-checkout>
      <form data-form novalidate>
        <fieldset class="fs">
          <legend>Contact</legend>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <span class="err" data-err="email"></span>
          </div>
        </fieldset>
        <fieldset class="fs">
          <legend>Shipping</legend>
          <div class="row-2">
            <div class="field"><label for="first">First name</label><input id="first" name="first" autocomplete="given-name" required><span class="err" data-err="first"></span></div>
            <div class="field"><label for="last">Last name</label><input id="last" name="last" autocomplete="family-name" required><span class="err" data-err="last"></span></div>
          </div>
          <div class="field"><label for="address">Address</label><input id="address" name="address" autocomplete="address-line1" required><span class="err" data-err="address"></span></div>
          <div class="field"><label for="address2">Apartment, suite (optional)</label><input id="address2" name="address2" autocomplete="address-line2"></div>
          <div class="row-3">
            <div class="field"><label for="city">City</label><input id="city" name="city" autocomplete="address-level2" required><span class="err" data-err="city"></span></div>
            <div class="field"><label for="state">State</label><input id="state" name="state" autocomplete="address-level1" maxlength="2" placeholder="NV" required><span class="err" data-err="state"></span></div>
            <div class="field"><label for="zip">ZIP</label><input id="zip" name="zip" autocomplete="postal-code" inputmode="numeric" required><span class="err" data-err="zip"></span></div>
          </div>
          <div class="field">
            <label for="country">Country</label>
            <select id="country" name="country" autocomplete="country"><option value="US">United States</option></select>
          </div>
        </fieldset>
        <button class="btn btn-solid-dark btn-block" type="submit" data-pay>Continue to payment</button>
        <p class="err" data-form-err role="alert"></p>
        <p class="secure-note">Payment is handled on Stripe's secure checkout page. TempoAthletics never sees or stores your card number.</p>
      </form>
      <aside class="summary-card" aria-label="Order summary">
        <h2 class="display" style="font-size:24px;margin-bottom:8px">Your order</h2>
        <div data-summary></div>
      </aside>
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script>
(function () {
  const form = document.querySelector("[data-form]");
  function renderSummary() {
    const items = Tempo.readCart();
    const box = document.querySelector("[data-summary]");
    if (!items.length) {
      document.querySelector("[data-checkout]").innerHTML = `
        <div class="empty" style="grid-column:1/-1">
          <img src="assets/logos/tempo-runner-black.png" alt="">
          <p><strong>Your cart is empty.</strong></p>
          <a class="btn btn-solid-dark" href="index.html#drop">Shop Drop 01</a>
        </div>`;
      return;
    }
    const t = Tempo.totals(items);
    box.innerHTML = items.map((i) => Tempo.lineItemHTML(i, true)).join("") + `
      <div class="totals" style="margin-top:16px">
        <div><span>Subtotal</span><span>${Tempo.money(t.subtotal)}</span></div>
        <div><span>Shipping</span><span>${t.shipping ? Tempo.money(t.shipping) : "Free"}</span></div>
        <div><span>Tax</span><span>Calculated at payment</span></div>
        <div class="grand"><span>Total</span><span>${Tempo.money(t.total)}</span></div>
      </div>`;
  }
  document.addEventListener("catalog:ready", renderSummary);
  document.addEventListener("cart:change", renderSummary);

  const rules = {
    email: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) || "Enter an email like name@example.com.",
    first: (v) => !!v || "Enter your first name.",
    last: (v) => !!v || "Enter your last name.",
    address: (v) => !!v || "Enter a street address.",
    city: (v) => !!v || "Enter a city.",
    state: (v) => /^[A-Za-z]{2}$/.test(v) || "Use the two-letter state code, like NV.",
    zip: (v) => /^\d{5}(-\d{4})?$/.test(v) || "Enter a 5-digit ZIP code.",
  };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    Object.keys(data).forEach((k) => (data[k] = String(data[k]).trim()));
    let firstBad = null;
    for (const [k, test] of Object.entries(rules)) {
      const r = test(data[k] || "");
      const input = form.elements[k];
      const err = form.querySelector(`[data-err="${k}"]`);
      if (r !== true) { err.textContent = r; input.setAttribute("aria-invalid", "true"); firstBad = firstBad || input; }
      else { err.textContent = ""; input.removeAttribute("aria-invalid"); }
    }
    if (firstBad) { firstBad.focus(); return; }

    const btn = form.querySelector("[data-pay]");
    const formErr = document.querySelector("[data-form-err]");
    btn.disabled = true; btn.textContent = "Opening secure payment…"; formErr.textContent = "";
    const order = { items: Tempo.readCart(), customer: data };
    try {
      const res = await fetch("api/checkout", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(order),
      });
      const out = await res.json().catch(() => ({}));
      if (res.ok && out.url) { location.href = out.url; return; }
      if (out.demo || res.status === 404 || res.status === 501) {
        // Payments not connected yet: record a demo order so the flow can be tested end to end.
        try { sessionStorage.setItem("tempo-last-order", JSON.stringify({ ...order, total: Tempo.totals(order.items).total })); } catch (x) {}
        location.href = "success.html?demo=1";
        return;
      }
      throw new Error(out.error || "Payment could not be started.");
    } catch (err) {
      formErr.textContent = `${err.message} Check your connection and try again.`;
      btn.disabled = false; btn.textContent = "Continue to payment";
    }
  });
})();
</script>
</body>
</html>
