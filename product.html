<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TempoAthletics</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/logos/tempo-runner-black.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="drop">
<main class="pdp">
  <div class="wrap" data-pdp></div>
</main>

<script src="js/app.js"></script>
<script>
document.addEventListener("catalog:ready", () => {
  const id = new URLSearchParams(location.search).get("id");
  const p = Tempo.findProduct(id);
  const root = document.querySelector("[data-pdp]");
  if (!p || p.status !== "available") {
    root.innerHTML = `<div class="confirm"><h1 class="display" style="font-size:48px">Not on the rack</h1>
      <p>This piece isn't available right now. See what's live in Drop 01.</p>
      <a class="btn btn-solid-dark" href="index.html#drop">Shop Drop 01</a></div>`;
    return;
  }
  document.title = `${p.name} | TempoAthletics`;
  let size = null;
  root.innerHTML = `
    <div class="pdp-grid">
      <div class="gallery">
        ${p.images.map((src, i) => `<div class="shot"><img src="${src}" alt="${p.name}, ${i ? "back" : "front"}"></div>`).join("")}
      </div>
      <div class="buy">
        <p class="muted" style="margin:0 0 8px">Drop 0${p.drop}, ${p.category}</p>
        <h1 class="display">${p.name}</h1>
        <div class="price">${Tempo.money(p.price)}</div>
        <p class="summary">${p.color}. ${p.summary}</p>
        <div class="size-row"><strong>Size</strong><button type="button" data-chart>Size chart</button></div>
        <div class="size-grid" role="group" aria-label="Choose a size">
          ${p.sizes.map((s) => `<button type="button" data-size="${s}" aria-pressed="false">${s}</button>`).join("")}
        </div>
        <p class="err" data-size-err></p>
        <button class="btn btn-solid-dark btn-block" type="button" data-add>Add to cart, ${Tempo.money(p.price)}</button>
        <a class="btn btn-block" href="index.html?size=M#fit-room" data-fit-link style="margin-top:10px">See it on a fit model</a>
        <details open>
          <summary>Fit</summary>
          <p>${p.fit}</p>
        </details>
        <details>
          <summary>Details</summary>
          <ul class="detail-list">${p.details.map((d) => `<li>${d}</li>`).join("")}</ul>
        </details>
        <details data-chart-panel>
          <summary>Size chart</summary>
          <table class="size-table">
            <thead><tr>${p.sizeChart.headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>
            <tbody>${p.sizeChart.rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>
          </table>
        </details>
        <details>
          <summary>Shipping and returns</summary>
          <p>Free shipping on orders over ${Tempo.money(Tempo.catalog.freeShippingThreshold)}. Unworn items can be returned within 30 days.</p>
        </details>
      </div>
    </div>`;

  root.querySelector(".size-grid").addEventListener("click", (e) => {
    const b = e.target.closest("[data-size]");
    if (!b) return;
    size = b.dataset.size;
    root.querySelectorAll("[data-size]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    root.querySelector("[data-size-err]").textContent = "";
    root.querySelector("[data-fit-link]").href = `index.html?size=${size}#fit-room`;
  });
  root.querySelector("[data-chart]").addEventListener("click", () => {
    const d = root.querySelector("[data-chart-panel]");
    d.open = true; d.scrollIntoView({ behavior: "smooth", block: "center" });
  });
  root.querySelector("[data-add]").addEventListener("click", () => {
    if (!size) { root.querySelector("[data-size-err]").textContent = "Choose a size to add this to your cart."; return; }
    Tempo.addToCart(p.id, size, 1);
    Tempo.toast(`Added ${p.name}, size ${size}`);
    Tempo.openCart();
  });
});
</script>
</body>
</html>
